<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio!</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #030712; 
            color: #ffffff; 
            font-family: 'Noto Sans KR', sans-serif; 
        }
        canvas { display: block; }
        
        #ui { 
            position: absolute; top: 20px; left: 20px; pointer-events: none; 
            text-shadow: 1px 1px 2px black; opacity: 1; transition: opacity 1.5s ease-in-out; 
            z-index: 10;
        }
        #loading { color: #ffffff; font-weight: 300; }

        #cinematic-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0); pointer-events: none; transition: background 1.2s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 500; display: flex; align-items: center; justify-content: flex-end;
        }
        #cinematic-overlay.active {
            background: linear-gradient(to left, rgba(3,7,18,0.98) 0%, rgba(3,7,18,0.9) 50%, rgba(3,7,18,0) 75%);
            pointer-events: auto;
        }

        #target-img-container {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.3);
            width: 45vw; height: 45vw; max-width: 650px; max-height: 650px;
            opacity: 0; transition: all 1.2s cubic-bezier(0.25, 1, 0.5, 1);
            z-index: 600; pointer-events: none; border-radius: 4px; overflow: hidden;
        }
        #target-img-container.active {
            left: 28%; transform: translate(-50%, -50%) scale(1);
            opacity: 1; pointer-events: auto;
        }
        #target-img {
            width: 100%; height: 100%; 
            object-fit: contain; 
            display: block;
        }

        #info-panel {
            position: absolute; right: -60vw; top: 0; width: 55vw; height: 100vh;
            padding: 8vh 4vw; box-sizing: border-box; display: flex; flex-direction: column;
            justify-content: center; z-index: 600; transition: right 1.2s cubic-bezier(0.25, 1, 0.5, 1);
            overflow-y: auto; color: #ffffff;
        }
        #info-panel.active { right: 0; }
        #info-panel h2 { color: #ffffff; margin: 0 0 10px 0; font-size: 2.2rem; font-weight: 700; letter-spacing: -0.5px; }
        #info-panel .coord { color: #ffffff; font-size: 1rem; margin-bottom: 30px; font-weight: 300; opacity: 0.8; }
        #info-panel h3 { color: #ffffff; border-bottom: 1px solid rgba(255,255,255,0.3); padding-bottom: 8px; margin-top: 30px; font-size: 1.1rem; font-weight: 400; }
        #info-panel p { line-height: 1.8; font-size: 1rem; color: #ffffff; white-space: pre-line; margin: 10px 0; font-weight: 300; }

        .action-btns { margin-top: 40px; display: flex; gap: 30px; }
        .text-btn {
            background: none; border: none; color: #ffffff; font-size: 1.1rem; font-weight: 400;
            cursor: pointer; padding: 0; transition: opacity 0.3s; text-transform: uppercase;
            letter-spacing: 1.5px; opacity: 0.7;
        }
        .text-btn:hover { opacity: 1; text-shadow: 0 0 10px rgba(255,255,255,0.8); }
    </style>
</head>
<body>
    <div id="ui">
        <h2>Wellcome!</h2>
        <p id="loading">Loading open source data....</p>
    </div>

    <div id="cinematic-overlay"></div>
    <div id="target-img-container">
        <img id="target-img" src="" alt="Target Image">
    </div>
    <div id="info-panel">
        <div>
            <h2 id="target-title">Name</h2>
            <div id="target-constellation" class="coord">Constellation</div>
            
            <h3>Equipment</h3>
            <p id="target-equip">equipments</p>
            
            <div class="action-btns">
                <button class="text-btn" id="back-btn">Back</button>
                <button class="text-btn" id="more-btn" style="display:none;">More</button>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        const customTargets = [
            {
                name: "Tarantula Nebula (NGC 2070)",
                constellation: "Dorado",
                ra: 84.67,     
                dec: -69.10,   
                size: 15.0,     
                images: [
                    {
                        url: "https://raw.githubusercontent.com/astro53396/Portfolio/main/2026-07-18T12.14.04.png",
                        equip: "Telescope: 10-inch Truss Tube Dobsonian / Astrograph\nMount: Paramount ME II\nCamera: ZWO ASI2600MM Pro\nFilters: Ha, OIII, SII Narrowband Mosaic"
                    }
                ]
            },
            {
                name: "Small Magellanic Cloud (SMC)",
                constellation: "Tucana",
                ra: 13.15,     
                dec: -72.80,   
                size: 7.0,     
                images: [
                    {
                        url: "https://raw.githubusercontent.com/astro53396/Portfolio/main/2026-07-12T23.22.50.png",
                        equip: "Telescope: Askar FRA400\nMount: ZWO AM5\nCamera: ZWO ASI2600MC Pro\nFilters: Dual-Band Filter"
                    }
                ]
            },
            {
                name: "47 Tucanae (NGC 104)",
                constellation: "Tucana",
                ra: 6.02,      
                dec: -72.08,   
                size: 1.5,     
                images: [
                    {
                        url: "https://raw.githubusercontent.com/astro53396/Portfolio/main/2026-07-12T11.59.44.png",
                        equip: "Telescope: 10-inch Truss Tube Dobsonian\nMount: Paramount ME II\nCamera: ZWO ASI2600MM Pro\nFilters: LRGB"
                    }
                ]
            },
            {
                name: "Carina Nebula (NGC 3372)",
                constellation: "Carina",
                ra: 161.26,    
                dec: -59.88,   
                size: 15.0,     
                images: [
                    {
                        url: "https://raw.githubusercontent.com/astro53396/Portfolio/main/2026-07-18T10.34.23.png",
                        equip: "Telescope: 10-inch Truss Tube Dobsonian / Astrograph\nMount: Paramount ME II\nCamera: ZWO ASI2600MM Pro\nFilters: Ha, OIII, SII Narrowband Mosaic"
                    }
                ]
            },
            {
                name: "Pleiades Cluster (Messier 45)",
                constellation: "Taurus",
                ra: 56.87,
                dec: 24.11,
                size: 6.0,     
                images: [
                    {
                        date: "12/Jun/2026",
                        url: "https://raw.githubusercontent.com/astro53396/Portfolio/main/2026-06-11T15.53.44.png",
                        equip: "Telescope: 10-inch Truss Tube Dobsonian\nMount: Paramount ME II\nCamera: ZWO ASI2600MM Pro\nFilters: Ha, OIII, SII"
                    },
                    {
                        date: "15/Nov/2021",
                        url: "https://raw.githubusercontent.com/astro53396/Portfolio/main/1763692299899.png",
                        equip: "Telescope: Askar FRA400\nMount: ZWO AM5\nCamera: ZWO ASI2600MC Pro\nFilters: Dual-Band"
                    }
                ]
            },
            {
                name: "Elephant's Trunk nebulae (NGC1396A)",
                constellation: "Cepheus",
                ra: 324.70,
                dec: 57.30,
                size: 6.0,     
                images: [
                    {
                        date: "12/Jun/2026",
                        url: "https://raw.githubusercontent.com/astro53396/Portfolio/main/2026-05-25T13.59.41.png",
                        equip: "Telescope: 10-inch Truss Tube Dobsonian\nMount: Paramount ME II\nCamera: ZWO ASI2600MM Pro\nFilters: Ha, OIII, SII"
                    },
                    {
                        date: "15/Nov/2021",
                        url: "https://raw.githubusercontent.com/astro53396/Portfolio/main/2026-05-26T03.17.27.png",
                        equip: "Telescope: Askar FRA400\nMount: ZWO AM5\nCamera: ZWO ASI2600MC Pro\nFilters: Dual-Band"
                    },
                    {
                        date: "15/Nov/2021",
                        url: "https://raw.githubusercontent.com/astro53396/Portfolio/main/1761818854062.png",
                        equip: "Telescope: Askar FRA400\nMount: ZWO AM5\nCamera: ZWO ASI2600MC Pro\nFilters: Dual-Band"
                    }
                ]
            },
            {
                name: "Dumbbell Nebula (M27)",
                constellation: "Vulpecula",
                ra: 299.90,
                dec: 22.72,
                size: 1.0,     
                images: [
                    {
                        url: "https://raw.githubusercontent.com/astro53396/Portfolio/main/1762395771167.png",
                        equip: "Telescope: Askar FRA400\nMount: ZWO AM5\nCamera: ZWO ASI2600MC Pro\nFilters: Dual-Band Filter"
                    }
                ]
            },
            {
                name: "Orion Nebulae (M42)",
                constellation: "Orion",
                ra: 83.822,
                dec: -5.391,
                size: 7.0,     
                images: [
                    {
                        url: "https://raw.githubusercontent.com/astro53396/Portfolio/main/2026-01-23T13.55.55.png",
                        equip: "Telescope: Askar FRA400\nMount: ZWO AM5\nCamera: ZWO ASI2600MC Pro\nFilters: Dual-Band Filter"
                    }
                ]
            },
            {
                name: "Andromeda galaxy (M31)",
                constellation: "Andromeda",
                ra: 10.685,
                dec: 41.269,
                size: 10.0,     
                images: [
                    {
                        url: "https://raw.githubusercontent.com/astro53396/Portfolio/main/1761728359725.png",
                        equip: "Telescope: Askar FRA400\nMount: ZWO AM5\nCamera: ZWO ASI2600MC Pro\nFilters: Dual-Band Filter"
                    }
                ]
            },
            {
                name: "Triangulum galaxy (M33)",
                constellation: "Triangulum",
                ra: 23.462,
                dec: 30.660,
                size: 7.0,     
                images: [
                    {
                        url: "https://raw.githubusercontent.com/astro53396/Portfolio/main/1761728359725.png",
                        equip: "Telescope: Askar FRA400\nMount: ZWO AM5\nCamera: ZWO ASI2600MC Pro\nFilters: Dual-Band Filter"
                    }
                ]
            },
        ];

        let selectedTarget = null;
        let currentImageIndex = 0;
        let isCinematicMode = false;

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
        camera.position.set(0, 0, 10); 
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; 
        controls.rotateSpeed = -0.5; 
        controls.enableZoom = false; 

        window.addEventListener('wheel', (event) => {
            if (isCinematicMode) return;
            camera.fov += event.deltaY * 0.05; 
            camera.fov = Math.max(10, Math.min(camera.fov, 100)); 
            camera.updateProjectionMatrix(); 
            controls.rotateSpeed = -0.5 * (camera.fov / 60);
        });

        const radius = 500;

        function get3DCoordinates(raDegree, decDegree, r) {
            const raRad = raDegree * (Math.PI / 180);
            const decRad = decDegree * (Math.PI / 180);
            const x = r * Math.cos(decRad) * Math.cos(raRad);
            const y = r * Math.sin(decRad);
            const z = -r * Math.cos(decRad) * Math.sin(raRad);
            return { x, y, z };
        }

        async function initSky() {
            try {
                const starsUrl = 'https://raw.githubusercontent.com/ofrohn/d3-celestial/master/data/stars.6.json';
                const linesUrl = 'https://raw.githubusercontent.com/ofrohn/d3-celestial/master/data/constellations.lines.json';

                const [starsResponse, linesResponse] = await Promise.all([
                    fetch(starsUrl), fetch(linesUrl)
                ]);

                const starsData = await starsResponse.json();
                const linesData = await linesResponse.json();

                const starVertices = [], starColors = [];
                starsData.features.forEach(feature => {
                    const [ra, dec] = feature.geometry.coordinates;
                    const mag = feature.properties.mag;
                    const { x, y, z } = get3DCoordinates(ra, dec, radius);
                    starVertices.push(x, y, z);
                    const brightness = Math.max(0.15, 1 - (mag + 1.5) / 7.5); 
                    starColors.push(brightness, brightness, brightness);
                });

                const starGeometry = new THREE.BufferGeometry();
                starGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starVertices, 3));
                starGeometry.setAttribute('color', new THREE.Float32BufferAttribute(starColors, 3));
                scene.add(new THREE.Points(starGeometry, new THREE.PointsMaterial({ size: 2.2, vertexColors: true })));

                const lineVertices = [];
                linesData.features.forEach(feature => {
                    feature.geometry.coordinates.forEach(lineSegment => {
                        for (let i = 0; i < lineSegment.length - 1; i++) {
                            const [ra1, dec1] = lineSegment[i];
                            const [ra2, dec2] = lineSegment[i+1];
                            const p1 = get3DCoordinates(ra1, dec1, radius);
                            const p2 = get3DCoordinates(ra2, dec2, radius);
                            lineVertices.push(p1.x, p1.y, p1.z, p2.x, p2.y, p2.z);
                        }
                    });
                });

                const lineGeometry = new THREE.BufferGeometry();
                lineGeometry.setAttribute('position', new THREE.Float32BufferAttribute(lineVertices, 3));
                scene.add(new THREE.LineSegments(lineGeometry, new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.2 })));

                createSkyTargets();

                document.getElementById('loading').innerText = "Loading complete";
                setTimeout(() => {
                    const uiElement = document.getElementById('ui');
                    uiElement.style.opacity = '0';
                    setTimeout(() => { uiElement.style.display = 'none'; }, 1500);
                }, 2000);

            } catch (error) {
                document.getElementById('loading').innerText = "error occured, please try again.";
                console.error("data loader:", error);
            }
        }

        const targetMeshes = [];
        const markerGroups = [];

        function createSoftTexture(imageUrl, isPleiades, callback) {
            const img = new Image();
            img.crossOrigin = "anonymous";
            img.src = imageUrl;
            img.onload = () => {
                const canvas = document.createElement('canvas');
                const size = 512;
                canvas.width = size;
                canvas.height = size;
                const ctx = canvas.getContext('2d');

                const isReversed = target.name.includes("Pleiades");
                const isRotated = target.name.includes("Andromeda galaxy");

                if (isReversed) {
                    ctx.translate(size, 0);
                    ctx.scale(-1, 1);
                }

                if (isRotated) {
                    ctx.translate(size / 2, size / 2);
                    ctx.rotate(Math.PI / 2);
                    ctx.translate(-size / 2, -size / 2);
                }

                ctx.drawImage(img, 0, 0, size, size);

                const gradient = ctx.createRadialGradient(size/2, size/2, size * 0.15, size/2, size/2, size * 0.48);
                gradient.addColorStop(0, 'rgba(0,0,0,1)');
                gradient.addColorStop(1, 'rgba(0,0,0,0)');

                ctx.globalCompositeOperation = 'destination-in';
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, size, size);

                const texture = new THREE.CanvasTexture(canvas);
                callback(texture);
            };
        }

        function createSkyTargets() {
            customTargets.forEach((target, index) => {
                const planeGeo = new THREE.PlaneGeometry(target.size * 5, target.size * 5);
                const planeMat = new THREE.MeshBasicMaterial({
                    transparent: true,
                    opacity: 0.8,
                    side: THREE.DoubleSide,
                    blending: THREE.AdditiveBlending
                });
                const imgPlane = new THREE.Mesh(planeGeo, planeMat);
                imgPlane.position.z = -1;

                const isPleiades = target.name.includes("Pleiades");

                createSoftTexture(target.images[0].url, isPleiades, (softTexture) => {
                    planeMat.map = softTexture;
                    planeMat.needsUpdate = true;
                });

                const segments = 64;
                const curvePoints = [];
                for (let i = 0; i <= segments; i++) {
                    const theta = (i / segments) * Math.PI * 2;
                    curvePoints.push(new THREE.Vector3(Math.cos(theta) * target.size * 2.8, Math.sin(theta) * target.size * 2.8, 0));
                }
                const circleGeometry = new THREE.BufferGeometry().setFromPoints(curvePoints);
                const dashedMaterial = new THREE.LineDashedMaterial({
                    color: 0xffffff,
                    dashSize: 2.0,
                    gapSize: 1.0,
                    transparent: true,
                    opacity: 0.8
                });
                const dashedCircle = new THREE.Line(circleGeometry, dashedMaterial);
                dashedCircle.computeLineDistances();

                const hitGeo = new THREE.PlaneGeometry(target.size * 6, target.size * 6);
                const hitMat = new THREE.MeshBasicMaterial({ visible: false, side: THREE.DoubleSide });
                const hitMesh = new THREE.Mesh(hitGeo, hitMat);

                const group = new THREE.Group();
                group.add(imgPlane);
                group.add(dashedCircle);
                group.add(hitMesh);
                
                const pos = get3DCoordinates(target.ra, target.dec, radius - 5);
                group.position.set(pos.x, pos.y, pos.z);
                group.lookAt(0, 0, 0);
                group.userData = { targetIndex: index };

                scene.add(group);
                targetMeshes.push(hitMesh);
                markerGroups.push({ group: group, circle: dashedCircle, targetData: target });
            });
        }

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('click', (event) => {
            if (isCinematicMode) return;
            if (event.target.closest('#info-panel')) return;

            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(targetMeshes);

            if (intersects.length > 0) {
                const targetIndex = intersects[0].object.parent.userData.targetIndex;
                openCinematicView(targetIndex, 0);
            }
        });

        let targetCameraPos = null;
        let targetLookAtPos = null;
        let isAnimatingCamera = false;
        
        const previousCameraState = {
            position: new THREE.Vector3(),
            target: new THREE.Vector3()
        };

        function openCinematicView(targetIndex, imgIndex) {
            isCinematicMode = true;
            selectedTarget = customTargets[targetIndex];
            currentImageIndex = imgIndex;
            const imgData = selectedTarget.images[currentImageIndex];

            previousCameraState.position.copy(camera.position);
            previousCameraState.target.copy(controls.target);

            markerGroups.forEach(m => {
                if (m.targetData === selectedTarget) {
                    m.circle.visible = false; 
                }
            });

            document.getElementById('target-title').innerText = selectedTarget.name;
            document.getElementById('target-constellation').innerText = `${selectedTarget.constellation} | RA: ${selectedTarget.ra}°, DEC: ${selectedTarget.dec}°`;
            document.getElementById('target-equip').innerText = imgData.equip;
            
            const container = document.getElementById('target-img-container');
            const targetImg = document.getElementById('target-img');
            
            targetImg.src = imgData.url;

            const moreBtn = document.getElementById('more-btn');
            if (selectedTarget.images.length > 1) {
                moreBtn.style.display = 'inline-block';
            } else {
                moreBtn.style.display = 'none';
            }

            document.getElementById('cinematic-overlay').classList.add('active');
            container.classList.add('active');
            document.getElementById('info-panel').classList.add('active');

            controls.enabled = false;

            const targetCoord = get3DCoordinates(selectedTarget.ra, selectedTarget.dec, radius);
            const dir = new THREE.Vector3(targetCoord.x, targetCoord.y, targetCoord.z).normalize();
            
            targetCameraPos = new THREE.Vector3(dir.x * (radius - 90), dir.y * (radius - 90), dir.z * (radius - 90));
            targetLookAtPos = new THREE.Vector3(targetCoord.x, targetCoord.y, targetCoord.z);
            isAnimatingCamera = true;
        }

        document.getElementById('back-btn').addEventListener('click', () => {
            isCinematicMode = false;

            markerGroups.forEach(m => {
                m.circle.visible = true;
            });

            document.getElementById('cinematic-overlay').classList.remove('active');
            document.getElementById('target-img-container').classList.remove('active');
            document.getElementById('info-panel').classList.remove('active');

            targetCameraPos = previousCameraState.position.clone();
            targetLookAtPos = previousCameraState.target.clone();
            isAnimatingCamera = true;
        });

        document.getElementById('more-btn').addEventListener('click', () => {
            if (selectedTarget && selectedTarget.images.length > 1) {
                currentImageIndex = (currentImageIndex + 1) % selectedTarget.images.length;
                const imgData = selectedTarget.images[currentImageIndex];
                
                const targetImg = document.getElementById('target-img');
                targetImg.src = imgData.url;
                document.getElementById('target-equip').innerText = imgData.equip;
            }
        });

        initSky();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);

            if (isAnimatingCamera && targetCameraPos && targetLookAtPos) {
                camera.position.lerp(targetCameraPos, 0.05);
                controls.target.lerp(targetLookAtPos, 0.05);
                
                if (camera.position.distanceTo(targetCameraPos) < 1.0) {
                    isAnimatingCamera = false;
                    if (!isCinematicMode) {
                        controls.enabled = true; 
                    }
                }
            }

            controls.update(); 
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
